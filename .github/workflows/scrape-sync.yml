name: Sync Jadwal BAAK (Full Harian)
run-name: Sinkronisasi Penuh Jadwal BAAK UNAMA oleh @${{ github.actor }}

on:
  # Tombol manual di tab Actions GitHub (bisa dipicu kapan saja)
  workflow_dispatch:
    inputs:
      filter_ruang:
        description: 'Filter Kelas yang Ingin Di-sync'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - labor
          - teori
      clean_db:
        description: 'Bersihkan data lama di database sebelum sync (Fresh Sync)?'
        required: false
        default: false
        type: boolean

  # Jadwal otomatis harian setiap pukul 00:00 WIB (17:00 UTC)
  schedule:
    - cron: '0 17 * * *'

concurrency:
  group: sync-baak-full
  cancel-in-progress: true

jobs:
  scrape-and-sync-full:
    name: Scrape & Upsert Seluruh Jadwal Semester ke Supabase
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: 🚀 Jalankan Full Scrapper Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BAAK_URL: ${{ secrets.BAAK_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          FLAGS="--sync"
          if [ "${{ github.event.inputs.filter_ruang }}" = "labor" ]; then
            FLAGS="$FLAGS --labor"
          elif [ "${{ github.event.inputs.filter_ruang }}" = "teori" ]; then
            FLAGS="$FLAGS --teori"
          fi
          if [ "${{ github.event.inputs.clean_db }}" = "true" ]; then
            FLAGS="$FLAGS --clean"
          fi
          echo "Menjalankan: bun apps/scrapper/src/index.ts $FLAGS"
          bun apps/scrapper/src/index.ts $FLAGS
