name: Sync Jadwal BAAK (Hari Ini / Tiap 10 Menit)
run-name: Quick Sync Jadwal Hari Ini oleh @${{ github.actor }}

on:
  # Tombol manual di tab Actions GitHub
  workflow_dispatch:
    inputs:
      filter_ruang:
        description: 'Filter Kelas yang Ingin Di-sync'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - labor
          - teori
      custom_date:
        description: 'Tanggal Kustom YYYY-MM-DD (Kosongkan untuk otomatis tanggal hari ini WIB)'
        required: false
        default: ''
        type: string

  # Jadwal otomatis setiap 10 menit
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: sync-baak-today
  cancel-in-progress: true

jobs:
  scrape-and-sync-today:
    name: Scrape & Upsert Jadwal Hari Ini ke Supabase
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: ⚡ Jalankan Optimized Scrapper Sync (Hari Ini)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BAAK_URL: ${{ secrets.BAAK_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          FLAGS="--sync"
          
          # Cek parameter tanggal
          if [ -n "${{ github.event.inputs.custom_date }}" ]; then
            FLAGS="$FLAGS --date ${{ github.event.inputs.custom_date }}"
          else
            FLAGS="$FLAGS --today"
          fi
          
          # Cek parameter ruang
          if [ "${{ github.event.inputs.filter_ruang }}" = "labor" ]; then
            FLAGS="$FLAGS --labor"
          elif [ "${{ github.event.inputs.filter_ruang }}" = "teori" ]; then
            FLAGS="$FLAGS --teori"
          fi
          
          echo "Menjalankan: bun apps/scrapper/src/index.ts $FLAGS"
          bun apps/scrapper/src/index.ts $FLAGS
